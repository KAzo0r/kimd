<!doctype html>
<html lang="uz" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IshTop.uz — O'zbekistonda ish va xodimlar qidirish | Работа в Узбекистане</title>
    <meta name="description" content="IshTop.uz — O'zbekistonning eng zamonaviy ish qidirish portali. Toshkent, Samarqand, Buxoro va butun respublika bo'ylab IT, bank, moliya va boshqa sohalarda 50+ ochiq vakansiyalar." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ishtop-theme-storage');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.state && data.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            } else if (data && data.state && data.state.theme === 'light') {
              document.documentElement.classList.remove('dark');
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            }
            if (data && data.state && data.state.language) {
              document.documentElement.setAttribute('lang', data.state.language);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
